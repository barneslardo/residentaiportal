services:
  postgres:
    image: postgres:16
    container_name: resident-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resident
      POSTGRES_PASSWORD: resident
      POSTGRES_DB: resident_portal
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resident -d resident_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
